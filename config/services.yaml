services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Everything in src/ becomes a service, so controllers, subscribers and your own
    # classes are wired up without any further configuration.
    MajesticDev\CommandNet\:
        resource: '../src/'
        exclude:
            - '../src/**/DataFixture/'
            - '../src/**/DependencyInjection/'
            - '../src/**/Entity/'
            - '../src/Calendar/'
            - '../src/Discord/'

    # The default (no Discord installed) binding for the AAR reminder's optional second
    # channel - see PatrolReminderNotifier. The Discord plugin decorates this service id.
    MajesticDev\CommandNet\Service\PatrolReminderNotifier: '@MajesticDev\CommandNet\Service\NullPatrolReminderNotifier'
